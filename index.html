<!DOCTYPE html>
<html lang="fi">

<head>
    <!DOCTYPE html>
    <html lang="fi">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Van Westendorp Price Sensitivity Meter</title>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.1.0/dist/chartjs-plugin-annotation.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

        <link rel="stylesheet" href="style.css">
    </head>

<body>
    <div class="container">
        <h1>Van Westendorp Price Sensitivity Meter</h1>
        <p class="subtitle">Analysoi hintaherkkyys neljän avainkysymyksen avulla</p>

        <div class="tabs" role="tablist">
            <button class="tab active" data-tab="upload">📤 Lataa data</button>
            <button class="tab" data-tab="data" id="dataTab" style="display:none;">📊 Data</button>
            <button class="tab" data-tab="results" id="resultsTabBtn" style="display:none;">📈 Tulokset</button>
        </div>

        <!-- UPLOAD TAB -->
        <div class="tab-content active" id="upload">
            <div class="upload-section">
                <p style="margin-bottom: 20px; color: #4a5568;">Lataa Excel-tiedosto tai käytä demoa</p>
                <input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls">
                <button class="upload-btn" id="openFileBtn">📊 Lataa Excel-tiedosto</button>
                <button class="use-demo-btn" id="demoBtn">🎯 Käytä demo-dataa</button>
            </div>

            <div class="column-mapping" id="columnMapping">
                <h3 style="margin-bottom: 15px; color: #2d3748;">Valitse sarakkeet</h3>
                <div class="mapping-grid">
                    <div class="mapping-item">
                        <label>Liian halpa (Too cheap):</label>
                        <select id="tooCheapCol"></select>
                    </div>
                    <div class="mapping-item">
                        <label>Edullinen (Bargain):</label>
                        <select id="bargainCol"></select>
                    </div>
                    <div class="mapping-item">
                        <label>Kallis (Expensive):</label>
                        <select id="expensiveCol"></select>
                    </div>
                    <div class="mapping-item">
                        <label>Liian kallis (Too expensive):</label>
                        <select id="tooExpensiveCol"></select>
                    </div>
                </div>
                <button class="analyze-btn" id="analyzeBtn">📈 Analysoi</button>
            </div>
        </div>

        <!-- DATA TAB -->
        <div class="tab-content" id="data">
            <h3 style="margin-bottom: 15px; color: #2d3748;">Muokkaa dataa</h3>
            <div class="data-table-container">
                <table class="data-table" id="dataTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Liian halpa</th>
                            <th>Edullinen</th>
                            <th>Kallis</th>
                            <th>Liian kallis</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
            </div>
            <div class="data-actions">
                <button class="add-row-btn" id="addRowBtn">➕ Lisää rivi</button>
                <button class="remove-row-btn" id="removeRowBtn">➖ Poista viimeinen rivi</button>
                <button class="update-btn" id="updateBtn">🔄 Päivitä analyysi</button>
            </div>
        </div>

        <!-- RESULTS TAB -->
        <div class="tab-content" id="results">
            <h2 style="margin-bottom: 20px; color: #2d3748;">Tulokset</h2>
            <div class="chart-container">
                <canvas id="psmChart"></canvas>
            </div>
            <div class="price-points" id="pricePoints"></div>

            <div style="margin-top: 30px; display: flex; gap: 10px; justify-content: center;">
                <button class="analyze-btn" id="exportExcelBtn" style="background: #2b6cb0;">📊 Vie Exceliin</button>
                <button class="analyze-btn" id="exportPptBtn" style="background: #c53030;">📽️ Vie
                    PowerPointiin</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
